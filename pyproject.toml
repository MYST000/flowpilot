[project]
name = "flowpilot"
version = "0.4.0"
description = "FlowPilot gateway with conservative reuse and deferred context sync"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.0",
  "fastapi>=0.104",
  "httpx>=0.27",
  "pydantic>=2",
  "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.407",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.13",
]

[project.scripts]
flowpilot = "flowpilot.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowpilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["../../openhands/software-agent-sdk/openhands-sdk"]
